name: Release

# Builds the PyPI artifacts (wheels for each supported platform + sdist) and
# publishes them. Triggered by version tags (`v*`), or manually via
# workflow_dispatch (set publish=true to upload to PyPI).
#
# leo3 dependency strategy for published builds:
# - Default (leo3_pin unset): build against leo3 at `leo3_ref` (default
#   main). A dedicated `resolve-leo3` job resolves the ref to a single
#   full commit SHA via `git ls-remote` BEFORE any build starts; every
#   build job (wheels matrix legs + sdist) checks out that exact SHA as
#   a sibling of leotower, so all artifacts in one release are
#   guaranteed to use the same leo3 revision (a mutable ref such as
#   main can no longer move between legs). Wheels use the path
#   dependency as-is; the sdist pins leo3 to the resolved SHA so it
#   builds standalone. The resolved leo3 commit is recorded in the job
#   summaries and the GitHub release body.
# - Official releases: set `leo3_pin` to a published crates.io version
#   (e.g. 0.3.2) — the dependency is rewritten to the crates.io release
#   per the Cargo.toml note. NOTE: leotower currently uses APIs that only
#   exist on leo3 main (leo3::meta::repl, MetaMContext::meta_state_snapshot
#   / replace_env), so no published leo3 version is compatible yet — 0.3.1
#   fails to compile. Use the default git mode until leo3 0.3.2+ ships.
#
# The Cargo.toml rewrite is done with a portable python3 script (no sed:
# BSD sed on macOS rejects `sed -i` without a backup suffix). It runs
# BEFORE `uv sync`, because uv sync would otherwise try to build the
# project and resolve the stale dependency first. `uv sync` runs with
# --no-install-project so it never builds the project; the real build is
# the explicit `maturin build` / `maturin sdist` step (run with
# `uv run --no-sync` so uv cannot re-sync and re-install the project).
#
# Runner notes:
# - macOS x86_64 uses the explicit `macos-15-intel` label (last x86_64
#   image GitHub offers, until Aug 2027); arm64 uses `macos-15`.
#   `macos-14` is arm64-only (deprecated, unsupported from Nov 2026) and
#   `macos-latest` drifts with platform migrations (macos-26 since
#   June 2026) — neither is used.
# - Linux aarch64 is not covered: it needs an ARM runner
#   (ubuntu-24.04-arm) or a cross-compile setup (leo3 supports
#   LEO3_CROSS_LIB_DIR).
# - The Windows wheel is not published until W-395 (Repl() aborts the
#   process on Windows in the leo3 in-process init path) is fixed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to PyPI (requires the PYPI_API_TOKEN secret)"
        type: boolean
        default: false
      leo3_ref:
        description: "leo3 branch/tag/commit to build against (git mode)"
        required: false
        default: "main"
      leo3_pin:
        description: "leo3 crates.io version (empty = build from git at leo3_ref)"
        required: false
        default: ""

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Resolve the leo3 ref to one full commit SHA before any build, so
  # every artifact in the release is built against the same revision
  # even if the ref (e.g. main) moves during the run.
  resolve-leo3:
    name: Resolve leo3 commit
    if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref to commit SHA
        id: resolve
        shell: bash
        env:
          REF: ${{ inputs.leo3_ref || 'main' }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            # Already a full commit SHA: nothing to resolve.
            SHA="$REF"
          else
            # Ask for the branch, the tag, and the peeled tag (annotated
            # tags: use the peeled commit, matching actions/checkout).
            OUT=$(git ls-remote https://github.com/LeanOxide/leo3.git \
              "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}")
            pick() { printf '%s\n' "$OUT" | awk -v r="$1" '$2 == r { print $1 }' | head -n1; }
            SHA=$(pick "refs/tags/$REF^{}")
            [ -n "$SHA" ] || SHA=$(pick "refs/tags/$REF")
            [ -n "$SHA" ] || SHA=$(pick "refs/heads/$REF")
            [ -n "$SHA" ] || { echo "::error::leo3 ref '$REF' matched no branch, tag, or SHA" >&2; exit 1; }
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::leo3 ref '$REF' resolved to non-SHA: '$SHA'" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "## leo3 dependency"
            echo "Resolved [leo3 @ $SHA](https://github.com/LeanOxide/leo3/commit/$SHA) (ref: $REF). All build jobs use this exact commit."
          } >> "$GITHUB_STEP_SUMMARY"

  wheels:
    needs: [resolve-leo3]
    # A skipped upstream job (crates.io mode: resolve-leo3 does not run)
    # skips downstream jobs that have no overriding if, and a plain
    # boolean if does not override that gating — only always() does.
    # So: in git mode require resolve-leo3 to have succeeded; in
    # crates.io mode (resolve not needed) run unconditionally.
    if: ${{ always() && ((inputs.leo3_pin || 'git') != 'git' || needs.resolve-leo3.result == 'success') }}
    name: Build wheels (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    outputs:
      leo3_commit: ${{ steps.leo3-verify.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
          - os: macos-15-intel
          - os: macos-15
          # windows-latest: re-add once W-395 is fixed.
    steps:
      - name: Checkout leotower
        uses: actions/checkout@v6
        with:
          path: leotower

      # Git mode: leo3 is a local path dependency (Cargo.toml: leo3 =
      # { path = "../leo3/leo3" }), so the leo3 repo must sit next to the
      # leotower checkout.
      - name: Checkout leo3 (sibling)
        id: leo3-checkout
        if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
        uses: actions/checkout@v6
        with:
          repository: LeanOxide/leo3
          ref: ${{ needs.resolve-leo3.outputs.sha }}
          fetch-depth: 1
          path: leo3

      # Record and verify the exact leo3 commit this build uses, so the
      # release is reproducible from the recorded ref/SHA.
      - name: Verify leo3 commit
        id: leo3-verify
        if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
        shell: bash
        env:
          COMMIT: ${{ steps.leo3-checkout.outputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::leo3 did not resolve to a full commit SHA (got: '$COMMIT')" >&2; exit 1; }
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo "## leo3 dependency"
            echo "Built against [leo3 @ $COMMIT](https://github.com/LeanOxide/leo3/commit/$COMMIT) (ref: ${{ inputs.leo3_ref || 'main' }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: leotower

      # The leo3 build script resolves the Lean toolchain, so it is needed
      # in both dependency modes. The toolchain is read from
      # leotower/lean-toolchain so the repo pin is the single source of
      # truth.
      - name: Read pinned Lean toolchain
        id: lean
        shell: bash
        run: |
          TOOLCHAIN=$(tr -d '\r\n' < leotower/lean-toolchain)
          [[ "$TOOLCHAIN" =~ ^leanprover/lean4: ]] || { echo "::error::unexpected lean-toolchain: $TOOLCHAIN" >&2; exit 1; }
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install elan
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -o elan.zip
            unzip elan.zip
            ./elan-init.exe -y --default-toolchain ${{ steps.lean.outputs.toolchain }}
            rm -f elan-init.exe elan.zip
          else
            echo "::group::Elan Installation Output"
            set -o pipefail
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain ${{ steps.lean.outputs.toolchain }}
            rm -f elan-init
            echo "::endgroup::"
          fi

      - name: Setup Lean PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "$USERPROFILE/.elan/bin" >> $GITHUB_PATH
          else
            echo "$HOME/.elan/bin" >> $GITHUB_PATH
          fi

      - name: Verify Lean installation
        shell: bash
        working-directory: leotower
        run: |
          lean --version
          lake --version

      # On Windows the Lean DLLs must be on PATH so the embedded runtime
      # can load them at test time.
      - name: Configure Lean library path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: leotower
        run: |
          LEAN_BIN=$(elan which lean)
          LEAN_HOME=$(dirname "$(dirname "$LEAN_BIN")")
          echo "$LEAN_HOME/bin" >> $GITHUB_PATH
          echo "LEAN_HOME=$LEAN_HOME" >> $GITHUB_ENV

      # Crates.io mode: pin the published leo3 release (official builds).
      # Must happen before `uv sync`, which would otherwise build the
      # project against the stale path dependency.
      - name: Rewrite leo3 dependency (crates.io mode)
        if: ${{ (inputs.leo3_pin || 'git') != 'git' }}
        shell: bash
        working-directory: leotower
        env:
          LEO3_MODE: crates
          LEO3_VERSION: ${{ inputs.leo3_pin }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          line = 'leo3 = { version = "' + os.environ["LEO3_VERSION"] + '", features = ["meta"] }'
          with open("Cargo.toml") as f:
              s = f.read()
          s2, n = re.subn(r'^leo3 = .*\n', line + "\n", s, count=1, flags=re.M)
          if n != 1:
              sys.exit("ERROR: 'leo3 =' line not found in Cargo.toml")
          with open("Cargo.toml", "w") as f:
              f.write(s2)
          print(line)
          PYEOF
          grep '^leo3' Cargo.toml

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --no-install-project: uv would otherwise build the project
      # (editable) here; the explicit maturin build below is the build.
      - name: Install dependencies
        working-directory: leotower
        run: uv sync --frozen --no-install-project --python 3.12

      - name: Build wheels
        working-directory: leotower
        run: uv run --no-sync maturin build --release -o dist

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.target.os }}
          path: leotower/dist/*.whl

  sdist:
    needs: [resolve-leo3]
    # See the if on the wheels job: always() is required to override
    # the skipped-dependency skip in crates.io mode.
    if: ${{ always() && ((inputs.leo3_pin || 'git') != 'git' || needs.resolve-leo3.result == 'success') }}
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout leotower
        uses: actions/checkout@v6
        with:
          path: leotower

      # Git mode: resolve leo3_ref to a commit so the sdist can pin it.
      - name: Checkout leo3
        id: leo3-checkout
        if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
        uses: actions/checkout@v6
        with:
          repository: LeanOxide/leo3
          ref: ${{ needs.resolve-leo3.outputs.sha }}
          fetch-depth: 1
          path: leo3

      - name: Verify leo3 commit
        id: leo3-verify
        if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
        shell: bash
        env:
          COMMIT: ${{ steps.leo3-checkout.outputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::leo3 did not resolve to a full commit SHA (got: '$COMMIT')" >&2; exit 1; }
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo "## leo3 dependency"
            echo "sdist pins [leo3 @ $COMMIT](https://github.com/LeanOxide/leo3/commit/$COMMIT) (ref: ${{ inputs.leo3_ref || 'main' }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Git mode: the sdist must build standalone, so pin leo3 to the
      # resolved git commit (the path dependency is only valid in the
      # sibling-checkout dev layout). Runs before `uv sync`.
      - name: Rewrite leo3 dependency (git mode)
        if: ${{ (inputs.leo3_pin || 'git') == 'git' }}
        shell: bash
        working-directory: leotower
        env:
          LEO3_MODE: git
          LEO3_SHA: ${{ steps.leo3-verify.outputs.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          line = 'leo3 = { git = "https://github.com/LeanOxide/leo3.git", rev = "' + os.environ["LEO3_SHA"] + '", features = ["meta"] }'
          with open("Cargo.toml") as f:
              s = f.read()
          s2, n = re.subn(r'^leo3 = .*\n', line + "\n", s, count=1, flags=re.M)
          if n != 1:
              sys.exit("ERROR: 'leo3 =' line not found in Cargo.toml")
          with open("Cargo.toml", "w") as f:
              f.write(s2)
          print(line)
          PYEOF
          grep '^leo3' Cargo.toml

      # Crates.io mode: same pin as the official wheel builds.
      - name: Rewrite leo3 dependency (crates.io mode)
        if: ${{ (inputs.leo3_pin || 'git') != 'git' }}
        shell: bash
        working-directory: leotower
        env:
          LEO3_MODE: crates
          LEO3_VERSION: ${{ inputs.leo3_pin }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          line = 'leo3 = { version = "' + os.environ["LEO3_VERSION"] + '", features = ["meta"] }'
          with open("Cargo.toml") as f:
              s = f.read()
          s2, n = re.subn(r'^leo3 = .*\n', line + "\n", s, count=1, flags=re.M)
          if n != 1:
              sys.exit("ERROR: 'leo3 =' line not found in Cargo.toml")
          with open("Cargo.toml", "w") as f:
              f.write(s2)
          print(line)
          PYEOF
          grep '^leo3' Cargo.toml

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --no-install-project: uv would otherwise build the project
      # (editable) here; `maturin sdist` below does not compile Rust.
      - name: Install dependencies
        working-directory: leotower
        run: uv sync --frozen --no-install-project --python 3.12

      - name: Build sdist (no Rust/Lean toolchain needed)
        working-directory: leotower
        run: uv run --no-sync maturin sdist -o dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: leotower/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install twine
        run: uv tool install twine

      - name: Check artifact metadata
        run: twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

  github-release:
    name: GitHub Release
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: ${{ (inputs.leo3_pin || 'git') == 'git' && format('Built against leo3 @ {0}', needs.wheels.outputs.leo3_commit) || format('leo3 {0} (crates.io)', inputs.leo3_pin) }}