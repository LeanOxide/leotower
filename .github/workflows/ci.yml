name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      leo3_ref:
        description: "leo3 branch/tag/commit to build against"
        required: false
        default: "main"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build & Test (${{ matrix.target.os }}, Python ${{ matrix.target.python }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-15-intel
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout leotower
        uses: actions/checkout@v6
        with:
          path: leotower

      # leo3 is a local path dependency (Cargo.toml: leo3 = { path =
      # "../leo3/leo3" }), so the leo3 repo must sit next to the leotower
      # checkout. It tracks main by default; override with the leo3_ref
      # workflow_dispatch input to test against a leo3 branch or commit.
      - name: Checkout leo3 (sibling)
        uses: actions/checkout@v6
        with:
          repository: LeanOxide/leo3
          ref: ${{ inputs.leo3_ref || 'main' }}
          fetch-depth: 1
          path: leo3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: leotower

      - name: Read pinned Lean toolchain
        id: lean
        shell: bash
        run: |
          TOOLCHAIN=$(tr -d '\r\n' < leotower/lean-toolchain)
          [[ "$TOOLCHAIN" =~ ^leanprover/lean4: ]] || { echo "::error::unexpected lean-toolchain: $TOOLCHAIN" >&2; exit 1; }
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install elan
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -o elan.zip
            unzip elan.zip
            ./elan-init.exe -y --default-toolchain ${{ steps.lean.outputs.toolchain }}
            rm -f elan-init.exe elan.zip
          else
            echo "::group::Elan Installation Output"
            set -o pipefail
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain ${{ steps.lean.outputs.toolchain }}
            rm -f elan-init
            echo "::endgroup::"
          fi

      - name: Setup Lean PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "$USERPROFILE/.elan/bin" >> $GITHUB_PATH
          else
            echo "$HOME/.elan/bin" >> $GITHUB_PATH
          fi

      - name: Verify Lean installation
        shell: bash
        working-directory: leotower
        run: |
          lean --version
          lake --version

      # On Windows the Lean DLLs must be on PATH so the embedded runtime
      # can load them at test time.
      - name: Configure Lean library path
        shell: bash
        run: |
          LEAN_BIN=$(elan which lean)
          LEAN_HOME=$(dirname "$(dirname "$LEAN_BIN")")
          echo "LEAN_HOME=$LEAN_HOME" >> $GITHUB_ENV
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Lean DLLs live in bin/ and are found via PATH
            echo "$LEAN_HOME/bin" >> $GITHUB_PATH
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --no-install-project: uv would otherwise build the project
      # (editable) here; the explicit maturin develop step below is the
      # build.
      - name: Install dependencies
        working-directory: leotower
        run: uv sync --frozen --no-install-project --python ${{ matrix.target.python }}

      - name: Build extension
        working-directory: leotower
        run: uv run --no-sync maturin develop

      # TEMP diagnostic: why does _leotower.pyd fail to load on Windows?
      - name: Diagnose Windows DLL loading
        if: runner.os == 'Windows'
        shell: bash
        working-directory: leotower
        run: |
          uv run --no-sync python - <<'EOF'
          import os, ctypes, struct, glob
          lean_bin = os.path.join(os.environ["LEAN_HOME"], "bin")
          out = []
          try:
              ctypes.CDLL("libleanshared.dll")
              out.append("by-name (PATH) load: OK")
          except OSError as e:
              out.append(f"by-name (PATH) load FAILED: {e}")
          for pyd in glob.glob(os.path.join("python", "leotower", "_leotower*.pyd")):
              with open(pyd, "rb") as f:
                  data = f.read()
              pe_off = struct.unpack_from("<I", data, 0x3C)[0]
              n_sec = struct.unpack_from("<H", data, pe_off + 6)[0]
              opt = pe_off + 24
              magic = struct.unpack_from("<H", data, opt)[0]
              dd = opt + (112 if magic == 0x20b else 96)
              rva, size = struct.unpack_from("<II", data, dd + 8)
              sec_start = opt + (240 if magic == 0x20b else 224)
              sections = []
              for i in range(n_sec):
                  vs, va, rs, ro = struct.unpack_from("<IIII", data, sec_start + i * 40 + 8)
                  sections.append((va, vs, rs, ro))

              def to_off(r):
                  for va, vs, rs, ro in sections:
                      if va <= r < va + max(vs, rs):
                          return ro + (r - va)
                  return None

              ioff = to_off(rva)
              imports = []
              i = 0
              while True:
                  e = struct.unpack_from("<IIII", data, ioff + i * 20)
                  if e[0] == 0 and e[3] == 0:
                      break
                  no = to_off(e[3])
                  end = data.index(b"\x00", no)
                  imports.append(data[no:end].decode())
                  i += 1
              out.append(f"{os.path.basename(pyd)} imports: {imports}")
          print("\n".join(out))
          EOF
      - name: Run tests
        shell: bash
        working-directory: leotower
        run: |
          # The extension references Lean dylibs via @rpath without an
          # embedded LC_RPATH, so point dyld at the elan toolchain's
          # lean lib dir (the runtime mechanism leo3 documents for macOS).
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$LEAN_HOME/lib/lean"
          fi
          uv run --no-sync pytest -v