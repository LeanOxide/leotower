[package]
name = "leo3-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for Leo3 — safe, ergonomic Rust bindings for the Lean4 theorem prover"
license = "MIT OR Apache-2.0"

[lib]
name = "_leo3"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
# Local path: track the in-tree leo3 crate for development.
# Use the crates.io release for published builds.
leo3 = { path = "../leo3/leo3" }
